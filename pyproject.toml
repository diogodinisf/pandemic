[project]
name = "pandemic"
version = "0.0.1"
description = "Visual implementation of an epidemic algorithm"
readme = "README.md"
authors = [
    { name = "Diogo Dinis" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12"
]

[dependency-groups]
dev = [
    "typer"
]
test = [
    
]

[tool.hatch.build.targets.wheel]
packages = ["src/pandemic"]

[build-system]
requires = ["hatchling >= 1.32.4"]
build-backend = "hatchling.build"
